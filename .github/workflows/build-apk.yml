name: Build APK From ZIP

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip source code
        run: |
          unzip door_memo_reminder_source.zip
          ls -la
          ls -la door_memo_reminder

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android platform files
        working-directory: door_memo_reminder
        run: flutter create . --platforms android --org com.nayeem --project-name door_memo_reminder

      - name: Force Android 15 SDK settings
        working-directory: door_memo_reminder
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for file in ["android/app/build.gradle", "android/app/build.gradle.kts"]:
              p = Path(file)
              if p.exists():
                  s = p.read_text()
                  s = s.replace("compileSdk = flutter.compileSdkVersion", "compileSdk = 35")
                  s = s.replace("minSdk = flutter.minSdkVersion", "minSdk = 23")
                  s = s.replace("targetSdk = flutter.targetSdkVersion", "targetSdk = 35")
                  s = s.replace("compileSdk flutter.compileSdkVersion", "compileSdk 35")
                  s = s.replace("minSdkVersion flutter.minSdkVersion", "minSdkVersion 23")
                  s = s.replace("targetSdkVersion flutter.targetSdkVersion", "targetSdkVersion 35")
                  p.write_text(s)
          PY

      - name: Add Android permissions
        working-directory: door_memo_reminder
        run: |
          cat > android/app/src/main/AndroidManifest.xml <<'XML'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/>
              <uses-permission android:name="android.permission.USE_EXACT_ALARM"/>
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>
              <uses-permission android:name="android.permission.VIBRATE"/>

              <application
                  android:label="Door Memo Reminder"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data
                        android:name="io.flutter.embedding.android.NormalTheme"
                        android:resource="@style/NormalTheme"/>
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />
              </application>
          </manifest>
          XML

      - name: Install dependencies
        working-directory: door_memo_reminder
        run: flutter pub get

      - name: Build release APK
        working-directory: door_memo_reminder
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: door-memo-reminder-apk
          path: door_memo_reminder/build/app/outputs/flutter-apk/app-release.apk
